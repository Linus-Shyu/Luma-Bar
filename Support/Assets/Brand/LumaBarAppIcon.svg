<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Luma Bar Notch Key app icon</title>
  <desc id="desc">A graphite keycap carrying an original ice-blue notched window symbol.</desc>
  <defs>
    <linearGradient id="shell" x1="250" y1="78" x2="754" y2="934" gradientUnits="userSpaceOnUse">
