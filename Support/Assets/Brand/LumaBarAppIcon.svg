      <stop offset="0.72" stop-color="#20252B"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="shell-edge" x1="512" y1="84" x2="512" y2="922" gradientUnits="userSpaceOnUse">
