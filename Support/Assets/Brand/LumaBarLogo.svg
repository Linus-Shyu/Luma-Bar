<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="512" viewBox="0 0 1600 512" role="img" aria-labelledby="title desc">
  <title id="title">luma bar logo</title>
  <desc id="desc">The original Luma Bar notched menu symbol on a graphite key, followed by the words luma bar.</desc>
