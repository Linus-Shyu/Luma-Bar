name: Release (Developer ID + Notarize)

# Push an annotated tag like v0.3.4 / v1.0.0 to publish a notarized build.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # --- Customize if you rename the product ---
  APP_DISPLAY_NAME: luma bar.app
  # Developer ID identity string must match the .p12 you upload as a secret.
  # Example: Developer ID Application: Luma Bar Core Team (AB12CD34EF)
  # Leave empty to auto-detect the first "Developer ID Application" in the CI keychain.
  CODESIGN_IDENTITY: ""

jobs:
  release:
    name: Build · Sign · Notarize
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (Swift 6)
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # Package.swift requires tools-version 6.0 → need Xcode 16+.
          SELECTED=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode_16.app \
            /Applications/Xcode.app
          do
            if [[ -d "$candidate" ]]; then
              SELECTED="$candidate"
              break
            fi
          done

          if [[ -z "$SELECTED" ]]; then
            echo "error: no Xcode 16+ found for Swift 6" >&2
            exit 1
          fi

          sudo xcode-select -s "$SELECTED/Contents/Developer"
          echo "Selected: $SELECTED"
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.' >/dev/null \
            || { echo "error: selected toolchain is not Swift 6" >&2; exit 1; }

      - name: Sync marketing version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "error: tag '$TAG' must look like v1.2.3" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          # Keep build number monotonic-ish: use run number when possible.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Support/Info.plist
          echo "Version → $VERSION (build ${{ github.run_number }})"

      - name: Import Developer ID certificate into temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${BUILD_CERTIFICATE_BASE64:?missing secret BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?missing secret P12_PASSWORD}"
          : "${KEYCHAIN_PASSWORD:?missing secret KEYCHAIN_PASSWORD}"

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer_id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/luma-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Installed identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve codesign identity
        id: identity
        run: |
          set -euo pipefail
          if [[ -n "${CODESIGN_IDENTITY}" ]]; then
            IDENTITY="$CODESIGN_IDENTITY"
          else
            IDENTITY="$(security find-identity -v -p codesigning 2>/dev/null | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          fi
          if [[ -z "$IDENTITY" ]]; then
            echo "error: no Developer ID Application identity in keychain" >&2
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Using: $IDENTITY"

      - name: Prepare notary credentials
        id: notary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          # Prefer Apple ID + app-specific password when all three are set.
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "Notary auth mode: Apple ID"
            echo "mode=apple-id" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${APPLE_API_KEY_BASE64:?missing notary secrets — set APPLE_ID+APPLE_APP_SPECIFIC_PASSWORD+APPLE_TEAM_ID, or APPLE_API_KEY_*}"
          : "${APPLE_API_KEY_ID:?missing secret APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER:?missing secret APPLE_API_ISSUER}"
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | tr -d '\n\r ' | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! head -n 1 "$KEY_PATH" | grep -q "BEGIN PRIVATE KEY"; then
            echo "error: APPLE_API_KEY_BASE64 did not decode to a .p8 key" >&2
            head -c 40 "$KEY_PATH" | xxd >&2 || true
            exit 1
          fi
          echo "Notary auth mode: App Store Connect API key"
          echo "mode=api-key" >> "$GITHUB_OUTPUT"
          {
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
          echo "Decoded API key OK ($(wc -c < "$KEY_PATH" | tr -d ' ') bytes)"

      - name: Build, sign, notarize, staple
        env:
          LUMA_BAR_CODESIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          LUMA_BAR_BUILD_UNIVERSAL: "1"
          LUMA_BAR_MAKE_DMG: "1"
          LUMA_BAR_RELEASE_DIR: dist
          LUMA_BAR_RELEASE_TAG: ${{ github.ref_name }}
          LUMA_BAR_DEEPSEEK_API_KEY: ${{ secrets.LUMA_BAR_DEEPSEEK_API_KEY }}
          # Apple ID path (preferred when secrets exist)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci_release.sh build_app.sh
          ./scripts/ci_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luma-Bar-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/release-meta.txt
            dist/luma bar.app
          if-no-files-found: error

      - name: Release metadata (internal vs public)
        id: relmeta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "title=Luma Bar ${TAG} (Internal)" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "## Luma Bar ${TAG} (Internal / pre-release)"
              echo ""
              echo "Internal development build — not a public launch."
              echo ""
              echo "Developer ID signed · notarized · stapled."
              echo ""
              echo "- Download the \`.dmg\` (preferred) or \`.zip\`"
              echo "- Drag **luma bar.app** to Applications"
              echo "- First launch may still ask for Accessibility / Automation / Microphone as designed"
              echo ""
              echo "Built by GitHub Actions run ${GITHUB_RUN_ID}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=Luma Bar ${TAG}" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "## Luma Bar ${TAG}"
              echo ""
              echo "Public release. Developer ID signed · notarized · stapled."
              echo ""
              echo "- Download the \`.dmg\` (preferred) or \`.zip\`"
              echo "- Drag **luma bar.app** to Applications"
              echo "- First launch may still ask for Accessibility / Automation / Microphone as designed"
              echo ""
              echo "Built by GitHub Actions run ${GITHUB_RUN_ID}."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relmeta.outputs.title }}
          draft: false
          prerelease: ${{ steps.relmeta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.dmg
          body: ${{ steps.relmeta.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          set +e
          security delete-keychain "${RUNNER_TEMP}/luma-signing.keychain-db" 2>/dev/null
          rm -f "${RUNNER_TEMP}/developer_id.p12"
          rm -f "${RUNNER_TEMP}/AuthKey_"*.p8
